<!doctype html>
<html lang="zh-Hant-TW" data-lang-mode="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>內容後台</title>
<link rel="icon" href="assets/img/icons/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="admin/admin.css">
<script type="module" src="admin/admin.js"></script>
</head>
<body data-page="admin">
<!-- 畫面上的文字由 admin.js 依 data-str 的編號，從 admin/strings.json 寫入 -->

<!-- 登入畫面。程式確認沒有已保存的權杖後才顯示 -->
<main class="admin-login" id="login-view" hidden>
  <div class="admin-lang-slot"></div>
  <h1 class="admin-title font-head" tabindex="-1" data-str="AD-01"></h1>
  <p class="admin-lead" data-str="AD-02"></p>

  <section class="admin-panel" aria-labelledby="token-guide-title">
    <h2 class="admin-panel-title" id="token-guide-title" data-str="AD-03"></h2>
    <ol class="admin-steps">
      <li>
        <span data-str="AD-04"></span>
        <a class="admin-link" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" data-str="AD-05"></a>
      </li>
      <li data-str="AD-06"></li>
      <li data-str="AD-07"></li>
      <li data-str="AD-08"></li>
      <li data-str="AD-09"></li>
    </ol>
    <p class="admin-warning" data-str="AD-10"></p>
  </section>

  <form class="admin-panel admin-form" id="login-form" novalidate>
    <h2 class="admin-panel-title" data-str="AD-11"></h2>

    <label class="admin-field">
      <span class="admin-label" data-str="AD-12"></span>
      <span class="admin-hint" id="repo-hint" data-str="AD-13"></span>
      <input type="text" id="repo-input" autocomplete="off" spellcheck="false" autocapitalize="off" aria-describedby="repo-hint" required>
    </label>

    <label class="admin-field">
      <span class="admin-label" data-str="AD-14"></span>
      <input type="password" id="token-input" autocomplete="off" spellcheck="false" autocapitalize="off" required>
    </label>

    <label class="admin-check">
      <input type="checkbox" id="remember-input">
      <span data-str="AD-15"></span>
    </label>
    <p class="admin-hint" data-str="AD-16"></p>

    <div class="admin-message" id="login-message" role="alert"></div>
    <button type="submit" class="admin-button" id="login-button" data-str="AD-11"></button>
  </form>
</main>

<!-- 登入後的畫面。編輯器在 P2-3 加入 -->
<div class="admin-app" id="app-view" hidden>
  <header class="admin-header">
    <span class="admin-header-title font-head" data-str="AD-01"></span>
    <span class="admin-repo" id="repo-name"></span>
    <div class="admin-lang-slot"></div>
    <button type="button" class="admin-button admin-button-quiet" id="logout-button" data-str="AD-17"></button>
  </header>
  <main class="admin-main" id="admin-main">
    <h1 class="visually-hidden" tabindex="-1" data-str="AD-01"></h1>
    <!-- 讀取中、錯誤、無法保存權杖等狀態訊息 -->
    <div class="admin-notice" id="app-lead" role="status"></div>
    <div class="admin-workspace" id="editor"></div>

  </main>
</div>

<!-- 文字檔讀進來之前只能顯示固定的文字，所以這裡直接寫中日兩種 -->
<div class="admin-loading" id="loading-view" role="status">
  <p class="t t-zh" lang="zh-Hant-TW">載入中</p>
  <p class="t t-ja" lang="ja">読み込み中</p>
</div>
<noscript>
  <p lang="zh-Hant-TW">本頁需要啟用 JavaScript 才能使用。</p>
  <p lang="ja">このページを使うには、JavaScriptを有効にしてください。</p>
</noscript>
</body>
</html>
